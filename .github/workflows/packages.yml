name: Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack --pack-destination artifacts
      - run: pnpm --dir packages/editor pack --pack-destination ../../artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ruxt-packages
          path: artifacts/*.tgz
